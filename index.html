<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Álbum Compartido del Evento 📸</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .upload-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
            box-sizing: border-box;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #5b4cc4; }
        
        /* Contenedor de Carpetas de Invitados */
        .guest-folder {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            box-sizing: border-box;
        }
        .folder-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f2f6;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Galería estilo Instagram interna por carpeta */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
        }
        .photo-card {
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .photo-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .photo-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .like-btn {
            background: none;
            color: #ff7675;
            border: 1px solid #ff7675;
            padding: 3px 10px;
            width: auto;
            font-size: 12px;
            border-radius: 20px;
        }
        .like-btn:hover { background: #ffeaa7; color: #ff7675; }
        .download-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
        #main-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

    <header>
        <h1>📸 Álbum del Evento</h1>
        <p>Comparte tus fotos con todos en tiempo real PAO & CHRIS</p>
    </header>

    <div class="upload-section">
        <h3>Subir Fotos</h3>
        <input type="text" id="guest-name" placeholder="Escribe tu nombre aquí..." required>
        <button id="upload-btn">📷 Tomar / Seleccionar Fotos</button>
    </div>

    <h2>Muro por Invitados</h2>
    <div id="main-container"></div>

    <script>
        // CONFIGURACIÓN DE TUS CREDENCIALES
        const CLOUDINARY_CLOUD_NAME = "donulclfh";
        const CLOUDINARY_PRESET = "wqekwrpw";
        const SUPABASE_URL = "https://xpfchmrzvuaoxcaubkuw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_SbpVjsPTcT8KRlQloCl0ZQ_1g2y5Fqt";

        // Inicializar Supabase
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Configurar el Widget de Cloudinary para Subida Múltiple
        const myWidget = cloudinary.createUploadWidget({
            cloudName: CLOUDINARY_CLOUD_NAME, 
            uploadPreset: CLOUDINARY_PRESET,
            sources: ['local', 'camera'],
            multiple: true, 
            maxFiles: 10     
        }, async (error, result) => {
            
            if (!error && result && result.event === "queues-end") { 
                const guestName = document.getElementById('guest-name').value.trim() || "Invitado Anónimo";
                
                // Extraer el paquete de imágenes subidas
                const fotosSubidas = result.info.files.map(file => {
                    return {
                        nombre_invitado: guestName,
                        url_foto: file.uploadInfo.secure_url
                    };
                });

                // Guardar bloque completo en Supabase
                const { error: dbError } = await _supabase
                    .from('galeria_fotos')
                    .insert(fotosSubidas); 
                
                if (dbError) {
                    alert("Error en Base de Datos: " + dbError.message);
                    console.error("DETALLE DEL ERROR:", dbError);
                } else {
                    alert("¡Tus fotos se subieron con éxito! 🎉");
                    cargarFotos(); 
                }
            }
        });

        // Evento al presionar el botón de subir foto
        document.getElementById("upload-btn").addEventListener("click", function() {
            const nameInput = document.getElementById('guest-name').value.trim();
            if(!nameInput) {
                alert("Por favor, ingresa tu nombre antes de subir una foto.");
                return;
            }
            myWidget.open(); 
        }, false);

        // Función para cargar, agrupar por invitados y mostrar las fotos
        async function cargarFotos() {
            const mainContainer = document.getElementById('main-container');
            mainContainer.innerHTML = "Cargando galería organizada...";

            const { data: fotos, error } = await _supabase
                .from('galeria_fotos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                mainContainer.innerHTML = "Error al cargar las fotos.";
                console.error(error);
                return;
            }

            if(fotos.length === 0) {
                mainContainer.innerHTML = "<p>Aún no hay fotos. ¡Sé el primero en subir una!</p>";
                return;
            }

            mainContainer.innerHTML = ""; // Limpiar contenedor principal

            // 📂 ALGORITMO DE AGRUPACIÓN (Creación de Carpetas Dinámicas)
            const fotosAgrupadas = {};
            
            fotos.forEach(foto => {
                const autor = foto.nombre_invitado || "Invitado Anónimo";
                if (!fotosAgrupadas[autor]) {
                    fotosAgrupadas[autor] = [];
                }
                fotosAgrupadas[autor].push(foto);
            });

            // Dibujar cada "Carpeta de Invitado" en la pantalla
            for (const invitado in fotosAgrupadas) {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'guest-folder';
                
                // Título de la carpeta con icono y cantidad de fotos subidas
                folderDiv.innerHTML = `
                    <div class="folder-title">📂 Fotos de ${invitado} (${fotosAgrupadas[invitado].length})</div>
                    <div class="gallery" id="gallery-${invitado.replace(/\s+/g, '-')}"></div>
                `;
                mainContainer.appendChild(folderDiv);

                // Insertar las fotos correspondientes dentro de esta carpeta
                const galleryDiv = folderDiv.querySelector('.gallery');
                
                fotosAgrupadas[invitado].forEach(foto => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `
                        <img src="${foto.url_foto}" alt="Foto de ${invitado}">
                        <div class="photo-info">
                            <div class="photo-actions">
                                <button class="like-btn" onclick="darLike(${foto.id}, ${foto.likes})">❤️ ${foto.likes}</button>
                                <a href="${foto.url_foto}" target="_blank" download="foto_evento.jpg" class="download-link">⬇️ Guardar</a>
                            </div>
                        </div>
                    `;
                    galleryDiv.appendChild(card);
                });
            }
        }

        // Función para manejar los Likes
        async function darLike(id, currentLikes) {
            const { error } = await _supabase
                .from('galeria_fotos')
                .update({ likes: currentLikes + 1 })
                .eq('id', id);

            if (!error) {
                cargarFotos(); 
            }
        }

        // Inicializar la carga
        cargarFotos();
    </script>
</body>
</html>
