<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 PAO & CHRIS Wedding Album 📸</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10507a; /* Azul Mediterráneo */
            --accent-gold: #b38b4d; /* Dorado Vintage para bordes y detalles */
            --bg: #111111;
            --text: #263238; /* Texto oscuro para las secciones claras */
        }
                
        body {
            font-family: 'Playfair Display', serif;
            background-color: var(--bg);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 🎆 CARRUSEL DE FONDO DINÁMICO */
        .bg-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -2;
            background: #000;
        }
        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            z-index: -2;
        }
        .bg-slide.active { opacity: 0.55; }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* 📱 PANTALLA PRINCIPAL DE BIENVENIDA */
        .welcome-container {
            min-height: 100vh;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }

        .mini-logo {
            max-width: 90px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 5px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }
        .sub-p {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            margin: 0 0 25px 0;
            opacity: 0.9;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        /* 📜 CAJA DE SUBIDA ESTILO PAPEL VINTAGE PERGAMINO */
        .upload-section {
            background-color: #fcf8f2;
            background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0);
            background-size: 4px 4px;
            padding: 25px 20px;
            border-radius: 16px;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 15px rgba(179,139,77,0.15);
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 25px;
            color: var(--text);
        }
                
        .upload-section h3 { 
            font-family: 'Great Vibes', cursive;
            margin-top: 0; 
            margin-bottom: 15px; 
            font-size: 36px; 
            font-weight: 400;
            color: var(--primary);
        }
                
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-style: italic;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.7);
            color: var(--text);
            text-align: center;
        }
        input[type="text"]::placeholder { color: rgba(38, 50, 56, 0.5); }
        input[type="text"]:focus { outline: none; box-shadow: 0 0 5px rgba(16,80,122,0.3); }
                
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .btn-label {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-style: italic;
            cursor: pointer;
            font-weight: bold;
            display: block;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(16,80,122,0.3);
            transition: transform 0.1s, background-color 0.3s;
        }
        .btn-label:active { transform: scale(0.99); }

        /* CONTADOR ESTILO KULULU COMPACTO */
        .photo-counter {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .scroll-arrow {
            font-size: 18px;
            animation: bounce 2s infinite;
            margin-top: 5px;
            cursor: pointer;
        }

        /* 📁 SECCIÓN DE MURO CLARO */
        .muro-section {
            width: 100%;
            max-width: 900px;
            padding: 25px 15px;
            box-sizing: border-box;
            background: rgba(247, 245, 238, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0,0,0,0.05);
            color: var(--text);
        }
        .muro-section h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 25px;
            font-weight: 400;
            color: var(--primary);
        }

        /* Carpetas con fondo pergamino claro sutil */
        .guest-folder {
            width: 100%;
            background: rgba(255, 254, 251, 0.70);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(179,139,77,0.2);
            border-left: 4px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .folder-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
        }
        .photo-card {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.03);
        }
        .photo-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            cursor: pointer;
        }

        .photo-info {
            padding: 6px;
            background: #ffffff;
        }
        .photo-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .like-btn, .action-download-btn {
            background: #f4f6f7;
            border: 1px solid rgba(0,0,0,0.06);
            padding: 5px 0;
            flex: 1;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .like-btn { color: #ff7675; }
        .like-btn:active { background: rgba(255,118,117,0.1); }
        .action-download-btn { color: var(--primary); }
        .action-download-btn:active { background: rgba(16,80,122,0.1); }

        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
        }
        .lightbox img {
            max-width: 95%;
            max-height: 80%;
            border-radius: 8px;
        }
        .close-lightbox-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 24px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="bg-carousel" id="carousel-container"></div>
    <div class="bg-overlay"></div>

    <div class="welcome-container">
        <img class="profile-avatar" src="https://res.cloudinary.com/donulclfh/image/upload/v1783518326/IMG_2825_n22k4r.jpg" alt="Pao & Chris" onerror="this.src='https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=300'">
        <img class="mini-logo" src="https://res.cloudinary.com/donulclfh/image/upload/v1783518962/Perro-blanco_otaloh.png" alt="Logo" onerror="this.style.display='none'">
        
        <h1>PAO & CHRIS</h1>
        <p class="sub-p" id="txt-subtitle">Comparte tus fotos con todos en tiempo real</p>

        <div class="upload-section">
            <h3 id="txt-box-title">Subir Fotos</h3>
            <input type="text" id="guest-name" placeholder="Escribe tu nombre aquí..." required>
            
            <div class="file-input-wrapper">
                <span class="btn-label" id="txt-btn-label">📷 Tomar / Seleccionar Fotos</span>
                <input type="file" id="direct-file-input" accept="image/*" multiple>
            </div>
        </div>

        <div class="photo-counter">
            📸 <span id="total-counter">0</span> <span id="txt-counter-label">fotos compartidas</span>
        </div>
        <div class="scroll-arrow" onclick="document.getElementById('muro').scrollIntoView({behavior: 'smooth'})">🔽</div>
    </div>

    <div class="muro-section" id="muro">
        <h2 id="txt-muro-title">Muro de Recuerdos</h2>
        <div id="main-container"></div>
    </div>

    <div id="lightbox" class="lightbox" onclick="cerrarImagen()">
        <button class="close-lightbox-btn" onclick="cerrarImagen()">❌</button>
        <img id="lightbox-img" src="" alt="Visualización" onclick="event.stopPropagation()">
    </div>

    <script>
        const BACKGROUND_IMAGES = [
            "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=1200",
            "https://res.cloudinary.com/donulclfh/image/upload/v1779637851/IMG_2831_1_sujacd.jpg",
            "https://res.cloudinary.com/donulclfh/image/upload/v1779522585/hm1fivoz07tp2s1qnbzu.jpg",
            "https://res.cloudinary.com/donulclfh/image/upload/v1779638364/PHOTO-2026-05-24-17-58-38_o1htpi.jpg",
            "https://res.cloudinary.com/donulclfh/image/upload/v1779640432/Gemini_Generated_Image_kwj90ekwj90ekwj9_lt7btl.png",
            "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?q=80&w=1200"
        ];

        const TRANSLATIONS = {
            es: {
                subtitle: "Comparte tus fotos con todos en tiempo real",
                boxTitle: "Subir Fotos",
                placeholder: "Escribe tu nombre aquí...",
                btnLabel: "Seleccionar Fotos",
                counterLabel: "fotos compartidas",
                muroTitle: "Muro de Recuerdos",
                loading: "Cargando galería organizada...",
                errorDb: "Error al cargar las fotos.",
                noPhotos: "<p style='text-align:center; opacity:0.6;'>Aún no hay fotos. ¡Sé el primero en subir una!</p>",
                folderTxt: "Fotos de",
                uploading: "⏳ Subiendo fotos...",
                alertSuccess: "¡Tus fotos se subieron automáticamente! 🎉",
                alertName: "Por favor, ingresa tu nombre antes de seleccionar las fotos."
            },
            en: {
                subtitle: "Share your photos with everyone in real time",
                boxTitle: "Upload Photos",
                placeholder: "Write your name here...",
                btnLabel: "Select Photos",
                counterLabel: "photos shared",
                muroTitle: "Memory Wall",
                loading: "Loading organized gallery...",
                errorDb: "Error loading photos.",
                noPhotos: "<p style='text-align:center; opacity:0.6;'>No photos yet. Be the first to upload one!</p>",
                folderTxt: "Photos by",
                uploading: "⏳ Uploading photos...",
                alertSuccess: "Your photos were uploaded automatically! 🎉",
                alertName: "Please, write your name before selecting photos."
            }
        };

        const userLang = navigator.language.startsWith('en') ? 'en' : 'es';
        const t = TRANSLATIONS[userLang];

        document.getElementById('txt-subtitle').innerText = t.subtitle;
        document.getElementById('txt-box-title').innerText = t.boxTitle;
        document.getElementById('guest-name').placeholder = t.placeholder;
        document.getElementById('txt-btn-label').innerText = t.btnLabel;
        document.getElementById('txt-counter-label').innerText = t.counterLabel;
        document.getElementById('txt-muro-title').innerText = t.muroTitle;

        const CLOUDINARY_CLOUD_NAME = "donulclfh";
        const CLOUDINARY_PRESET = "wqekwrpw";
        const SUPABASE_URL = "https://xpfchmrzvuaoxcaubkuw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_SbpVjsPTcT8KRlQloCl0ZQ_1g2y5Fqt";

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const carouselContainer = document.getElementById('carousel-container');
        BACKGROUND_IMAGES.forEach((imgUrl, index) => {
            const slide = document.createElement('div');
            slide.className = `bg-slide ${index === 0 ? 'active' : ''}`;
            slide.style.backgroundImage = `url('${imgUrl}')`;
            carouselContainer.appendChild(slide);
        });

        let currentSlideIndex = 0;
        const slides = document.querySelectorAll('.bg-slide');
        if (slides.length > 0) {
            setInterval(() => {
                slides[currentSlideIndex].classList.remove('active');
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                slides[currentSlideIndex].classList.add('active');
            }, 4500);
        }

        document.getElementById('direct-file-input').addEventListener('change', async function(e) {
            const guestName = document.getElementById('guest-name').value.trim();
            const files = e.target.files;

            if (!guestName) {
                alert(t.alertName);
                this.value = ""; 
                return;
            }

            if (files.length === 0) return;

            const labelBtn = document.getElementById('txt-btn-label');
            const originalText = labelBtn.innerText;
            labelBtn.innerText = t.uploading;
            labelBtn.style.backgroundColor = "#b2bec3";

            const fotosSubidas = [];

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append('file', files[i]);
                formData.append('upload_preset', CLOUDINARY_PRESET);

                try {
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (data.secure_url) {
                        // Optimización e incompatibilidad de formatos (por ejemplo HEIC de iPhones)
                        const urlOptimizada = data.secure_url.replace('/upload/', '/upload/f_auto,q_auto/');
                        fotosSubidas.push({ nombre_invitado: guestName, url_foto: urlOptimizada });
                    }
                } catch (err) {
                    console.error("Error al subir a Cloudinary:", err);
                }
            }

            if (fotosSubidas.length > 0) {
                const { error: dbError } = await _supabase.from('galeria_fotos').insert(fotosSubidas);
                if (!dbError) alert(t.alertSuccess);
            }

            labelBtn.innerText = originalText;
            labelBtn.style.backgroundColor = "var(--primary)";
            this.value = ""; 
            cargarFotos();
        });

        async function cargarFotos() {
            const mainContainer = document.getElementById('main-container');
            mainContainer.innerHTML = t.loading;

            const { data: fotos, error } = await _supabase
                .from('galeria_fotos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                mainContainer.innerHTML = t.errorDb;
                return;
            }

            document.getElementById('total-counter').innerText = fotos ? fotos.length : 0;

            if (!fotos || fotos.length === 0) {
                mainContainer.innerHTML = t.noPhotos;
                return;
            }

            mainContainer.innerHTML = ""; 

            const fotosAgrupadas = {};
            fotos.forEach(foto => {
                const autor = foto.nombre_invitado || "Invitado Anónimo";
                if (!fotosAgrupadas[autor]) fotosAgrupadas[autor] = [];
                fotosAgrupadas[autor].push(foto);
            });

            for (const invitado in fotosAgrupadas) {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'guest-folder';
                                
                folderDiv.innerHTML = `
                    <div class="folder-title">📂 ${t.folderTxt} ${invitado} (${fotosAgrupadas[invitado].length})</div>
                    <div class="gallery"></div>
                `;
                mainContainer.appendChild(folderDiv);

                const galleryDiv = folderDiv.querySelector('.gallery');
                                
                fotosAgrupadas[invitado].forEach(foto => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    const numLikes = foto.likes || 0;
                    card.innerHTML = `
                        <img src="${foto.url_foto}" alt="Foto de ${invitado}" onclick="verImagenGrande('${foto.url_foto}')" onerror="this.parentElement.style.display='none'">
                        <div class="photo-info">
                            <div class="photo-actions">
                                <button class="like-btn" id="like-btn-${foto.id}" onclick="darLike(${foto.id}, ${numLikes})">❤️ ${numLikes}</button>
                                <button class="action-download-btn" onclick="descargarFotoDirecta('${foto.url_foto}', 'foto_${invitado}')">📥</button>
                            </div>
                        </div>
                    `;
                    galleryDiv.appendChild(card);
                });
            }
        }

        async function darLike(id, currentLikes) {
            const nuevoTotal = currentLikes + 1;
            const botonLike = document.getElementById(`like-btn-${id}`);
            if (botonLike) {
                botonLike.innerText = `❤️ ${nuevoTotal}`;
                botonLike.onclick = function() { darLike(id, nuevoTotal); };
            }
            await _supabase.from('galeria_fotos').update({ likes: nuevoTotal }).eq('id', id);
        }

        async function descargarFotoDirecta(url, nombreArchivo) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `${nombreArchivo}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                window.open(url, '_blank');
            }
        }

        function verImagenGrande(url) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = url;
            lightbox.style.display = 'flex';
        }

        function cerrarImagen() {
            document.getElementById('lightbox').style.display = 'none';
        }

        cargarFotos();
    </script>
</body>
</html>
